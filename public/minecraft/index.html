<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#8fc8ff" />
  <title>Voxel Craft — ブラウザ・マイクラ風ゲーム</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #8fc8ff;
      font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      -webkit-user-select: none; user-select: none; }
    #game { display: block; width: 100vw; height: 100vh; }

    /* Crosshair */
    #crosshair { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 22px; height: 22px; pointer-events: none; z-index: 5; mix-blend-mode: difference; }
    #crosshair::before, #crosshair::after { content: ""; position: absolute; background: #fff; }
    #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
    #crosshair::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }

    /* HUD */
    #hud { position: fixed; top: 8px; left: 8px; z-index: 6; color: #fff;
      font-size: 13px; font-variant-numeric: tabular-nums; line-height: 1.5;
      text-shadow: 0 1px 2px rgba(0,0,0,.8); pointer-events: none; }

    /* Hotbar */
    #hotbar { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 4px; z-index: 6; padding: 4px;
      background: rgba(0,0,0,.32); border-radius: 8px; }
    .slot { position: relative; width: 50px; height: 50px; border-radius: 6px;
      background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.18);
      display: flex; align-items: center; justify-content: center; }
    .slot.active { border-color: #fff; background: rgba(255,255,255,.22);
      box-shadow: 0 0 0 2px rgba(0,0,0,.35); }
    .slot canvas { width: 38px; height: 38px; image-rendering: pixelated; border-radius: 3px; }
    .slot .num { position: absolute; top: 1px; left: 4px; font-size: 10px; color: #fff;
      text-shadow: 0 1px 2px #000; }
    .slot .name { position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%);
      font-size: 9px; color: #fff; white-space: nowrap; text-shadow: 0 1px 2px #000;
      opacity: 0; transition: opacity .15s; }
    .slot.active .name { opacity: 1; }

    #reset { position: fixed; top: 8px; right: 8px; z-index: 7; font-size: 12px;
      color: #fff; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.25);
      border-radius: 6px; padding: 5px 9px; cursor: pointer; }
    #reset:hover { background: rgba(0,0,0,.55); }

    /* Start / pause overlay */
    #overlay { position: fixed; inset: 0; z-index: 10; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 35%, rgba(20,40,80,.55), rgba(5,10,25,.85));
      color: #fff; text-align: center; cursor: pointer; }
    #overlay h1 { font-size: 40px; letter-spacing: 2px; margin-bottom: 6px;
      text-shadow: 0 3px 10px rgba(0,0,0,.6); }
    #overlay .tag { font-size: 14px; opacity: .85; margin-bottom: 26px; }
    #overlay .play { font-size: 18px; font-weight: 700; padding: 12px 30px; border-radius: 10px;
      background: #5aa845; box-shadow: 0 6px 0 #3c7a2c, 0 10px 18px rgba(0,0,0,.4);
      margin-bottom: 30px; }
    .controls { display: grid; grid-template-columns: auto auto; gap: 6px 18px;
      font-size: 13px; opacity: .9; }
    .controls b { display: inline-block; min-width: 96px; color: #ffe08a;
      font-family: ui-monospace, monospace; }
    .hint { margin-top: 22px; font-size: 12px; opacity: .6; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="crosshair"></div>
  <div id="hud"></div>
  <div id="hotbar"></div>
  <button id="reset" title="ワールドの編集をリセット">リセット</button>

  <div id="overlay">
    <h1>⛏ VOXEL CRAFT</h1>
    <div class="tag">Three.js 製・ブラウザで動くマインクラフト風ボクセルゲーム</div>
    <div class="play">▶ クリックしてプレイ</div>
    <div class="controls">
      <span><b>W A S D</b> 移動</span><span><b>マウス</b> 視点</span>
      <span><b>スペース</b> ジャンプ</span><span><b>左クリック</b> ブロックを壊す</span>
      <span><b>右クリック</b> ブロックを置く</span><span><b>1-9 / ホイール</b> ブロック選択</span>
      <span><b>スペース2回</b> 飛行モード切替</span><span><b>Shift</b> ダッシュ / 降下</span>
      <span><b>Esc</b> ポーズ</span><span><b>飛行中: Space/Shift</b> 上下</span>
    </div>
    <div class="hint">地形・洞窟・木・水・昼夜サイクルを自動生成。編集内容は自動保存されます。</div>
  </div>

  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
